name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.set.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        run: echo "release_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - name: webhook
            dockerfile: Dockerfile.webhook
            tag: chur-webhook
            goflags: ""
          - name: init-slim
            dockerfile: Dockerfile.init
            tag: chur-init
            tag_suffix: -slim
            goflags: ""
          - name: init-full
            dockerfile: Dockerfile.init
            tag: chur-init
            tag_suffix: ""
            goflags: -tags=provider_k8s
          - name: keeper
            dockerfile: Dockerfile.keeper
            tag: chur-keeper
            goflags: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.release_version }}
            GOFLAGS=${{ matrix.goflags }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}${{ matrix.tag_suffix }}:${{ needs.version.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}${{ matrix.tag_suffix }}:${{ needs.version.outputs.release_version }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Generate ${{ matrix.name }} SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}${{ matrix.tag_suffix }}:${{ needs.version.outputs.release_version }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.json
          scanners: vuln

      - name: Upload ${{ matrix.name }} SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json
          retention-days: 90

  push:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Push all images (multi-arch)
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ needs.version.outputs.release_version }} \
            --cache-from type=gha \
            -t ghcr.io/${{ github.repository_owner }}/chur-webhook:${{ needs.version.outputs.release_version }} \
            -t ghcr.io/${{ github.repository_owner }}/chur-webhook:latest \
            -f Dockerfile.webhook .
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ needs.version.outputs.release_version }} \
            --cache-from type=gha \
            -t ghcr.io/${{ github.repository_owner }}/chur-init:${{ needs.version.outputs.release_version }}-slim \
            -f Dockerfile.init .
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ needs.version.outputs.release_version }} \
            --build-arg GOFLAGS="-tags=provider_k8s" \
            --cache-from type=gha \
            -t ghcr.io/${{ github.repository_owner }}/chur-init:${{ needs.version.outputs.release_version }} \
            -t ghcr.io/${{ github.repository_owner }}/chur-init:latest \
            -f Dockerfile.init .
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ needs.version.outputs.release_version }} \
            --cache-from type=gha \
            -t ghcr.io/${{ github.repository_owner }}/chur-keeper:${{ needs.version.outputs.release_version }} \
            -t ghcr.io/${{ github.repository_owner }}/chur-keeper:latest \
            -f Dockerfile.keeper .

  release:
    needs: [version, push]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.release_version }}/" charts/chur/Chart.yaml
          sed -i 's/^appVersion:.*/appVersion: "${{ needs.version.outputs.release_version }}"/' charts/chur/Chart.yaml

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            {
              echo "CHANGELOG<<EOF"
              git log --no-merges --format="* %s" "$PREV_TAG..HEAD"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Publish Helm chart
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          pages_branch: helm-charts
          mark_as_latest: true
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NAME_TEMPLATE: "v{{ .Version }}"

      - name: Push chart to OCI
        run: |
          helm package charts/chur/ -d /tmp
          helm push /tmp/chur-${{ needs.version.outputs.release_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          rm /tmp/chur-${{ needs.version.outputs.release_version }}.tgz

      - name: Update release body
        if: env.CHANGELOG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --notes "$CHANGELOG"

  validate:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: latest }
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with: { cluster_name: chur-validate }
      - name: Validate release
        run: bash hack/validate-release.sh "${{ needs.version.outputs.release_version }}"
